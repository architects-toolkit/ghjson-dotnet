name: 'Version Manager'
description: 'Unified version and badge management using tools/Change-SolutionVersion.ps1'
inputs:
  mode:
    description: 'Mode: set-version, update-date, or badges-only'
    required: true
    default: 'badges-only'
  new-version:
    description: 'New version to set (required for set-version mode)'
    required: false
  require-src-changes:
    description: 'Only proceed if src/ files changed in the last commit'
    required: false
    default: 'false'

outputs:
  version:
    description: 'Current version from Directory.Build.props (before update)'
    value: ${{ steps.get-version.outputs.version }}
  new-version:
    description: 'New version after update'
    value: ${{ steps.detect-changes.outputs.new-version || steps.get-version.outputs.version }}
  major:
    description: 'Major version component'
    value: ${{ steps.get-version.outputs.major }}
  minor:
    description: 'Minor version component'
    value: ${{ steps.get-version.outputs.minor }}
  patch:
    description: 'Patch version component'
    value: ${{ steps.get-version.outputs.patch }}
  suffix:
    description: 'Version suffix (if any)'
    value: ${{ steps.get-version.outputs.suffix }}
  stage:
    description: 'Release stage'
    value: ${{ steps.get-version.outputs.stage }}
  badges-changed:
    description: 'Whether README badges were changed'
    value: ${{ steps.detect-changes.outputs.badges-changed || 'false' }}
  src-changes-found:
    description: 'Whether src/ changes were detected'
    value: ${{ steps.check-src-changes.outputs.src-changes-found || 'true' }}
  has-changes:
    description: 'Whether any tracked files were modified'
    value: ${{ steps.detect-changes.outputs.has-changes || 'false' }}

runs:
  using: "composite"
  steps:
    - name: Get version from Directory.Build.props
      id: get-version
      uses: ./.github/actions/versioning/get-version

    - name: Check for src/ changes
      id: check-src-changes
      shell: pwsh
      run: |
        $requireSrcChanges = '${{ inputs.require-src-changes }}' -eq 'true'
        if (-not $requireSrcChanges) {
          Write-Host "require-src-changes is false; skipping src/ changes check."
          "src-changes-found=true" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 0
        }

        # Check if any files under src/ changed in the last commit
        $changedFiles = git diff --name-only HEAD~1 HEAD 2>$null
        if (-not $changedFiles) {
          # Fallback: check working tree vs HEAD for any src/ changes
          $changedFiles = git diff --name-only HEAD 2>$null
        }

        $hasSrcChanges = $false
        foreach ($file in $changedFiles) {
          if ($file -match '^src/') {
            $hasSrcChanges = $true
            break
          }
        }

        if ($hasSrcChanges) {
          Write-Host "Found src/ changes. Proceeding." -ForegroundColor Green
          "src-changes-found=true" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append -Encoding utf8
        } else {
          Write-Host "No src/ changes detected. Skipping version update." -ForegroundColor Yellow
          "src-changes-found=false" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append -Encoding utf8
        }

    - name: Run Change-SolutionVersion.ps1
      id: update
      if: steps.check-src-changes.outputs.src-changes-found != 'false' && inputs.mode != 'badges-only'
      shell: pwsh
      run: |
        $mode = '${{ inputs.mode }}'
        $newVersion = '${{ inputs.new-version }}'
        $scriptPath = "tools/Change-SolutionVersion.ps1"

        if (-not (Test-Path $scriptPath)) {
          Write-Error "Script not found: $scriptPath"
          exit 1
        }

        switch ($mode) {
          'set-version' {
            if ([string]::IsNullOrWhiteSpace($newVersion)) {
              Write-Error "new-version input is required for set-version mode"
              exit 1
            }
            Write-Host "Mode: set-version -> $newVersion"
            & $scriptPath -Version $newVersion
          }
          'update-date' {
            Write-Host "Mode: update-date"
            & $scriptPath -UpdateDateOnly
          }
          default {
            Write-Error "Unknown mode: $mode. Expected 'set-version', 'update-date', or 'badges-only'."
            exit 1
          }
        }

        if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) {
          Write-Error "Change-SolutionVersion.ps1 failed (exit $LASTEXITCODE)."
          exit $LASTEXITCODE
        }

    - name: Update badges only
      id: update-badges
      if: steps.check-src-changes.outputs.src-changes-found != 'false' && inputs.mode == 'badges-only'
      uses: ./.github/actions/documentation/update-badges

    - name: Detect changes
      id: detect-changes
      shell: bash
      run: |
        set -euo pipefail

        if [[ "${{ steps.check-src-changes.outputs.src-changes-found }}" == "false" ]]; then
          echo "has-changes=false" >> "$GITHUB_OUTPUT"
          echo "badges-changed=false" >> "$GITHUB_OUTPUT"
          echo "new-version=${{ steps.get-version.outputs.version }}" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        TRACKED=(Directory.Build.props README.md CHANGELOG.md)
        if git status --porcelain -- "${TRACKED[@]}" | grep -q .; then
          echo "has-changes=true" >> "$GITHUB_OUTPUT"
        else
          echo "has-changes=false" >> "$GITHUB_OUTPUT"
        fi

        if git status --porcelain -- README.md | grep -q .; then
          echo "badges-changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "badges-changed=false" >> "$GITHUB_OUTPUT"
        fi

        NEW_VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
        echo "new-version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
