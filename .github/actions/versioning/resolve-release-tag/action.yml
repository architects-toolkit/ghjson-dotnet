name: Resolve Release Tag
description: Resolve and validate an immutable release tag. Accepts legacy v-prefixed tags; the `version` output is always the bare X.Y.Z[-suffix] form.

inputs:
  tag:
    description: Optional release tag to resolve; empty selects the newest matching tag.
    required: false
    default: ''
  stable-only:
    description: Whether to accept only stable X.Y.Z tags.
    required: false
    default: 'false'
  line:
    description: Optional X.Y release line the tag must belong to.
    required: false
    default: ''
  reject-branches:
    description: Whether branch refs must be rejected as tag inputs.
    required: false
    default: 'false'
  ancestor-of:
    description: Optional branch or ref whose history must contain the tag.
    required: false
    default: ''

outputs:
  tag:
    description: Resolved release tag ref name as stored in git (may carry a legacy v prefix).
    value: ${{ steps.resolve.outputs.tag }}
  version:
    description: Bare version extracted from the tag (no v prefix).
    value: ${{ steps.resolve.outputs.version }}
  sha:
    description: Commit SHA resolved from the release tag.
    value: ${{ steps.resolve.outputs.sha }}
  line:
    description: X.Y release line from the tag.
    value: ${{ steps.resolve.outputs.line }}
  core:
    description: X.Y.Z core version from the tag.
    value: ${{ steps.resolve.outputs.core }}

runs:
  using: composite
  steps:
    - name: Resolve release tag
      id: resolve
      shell: bash
      env:
        REQUESTED_TAG: ${{ inputs.tag }}
        STABLE_ONLY: ${{ inputs.stable-only }}
        REQUESTED_LINE: ${{ inputs.line }}
        REJECT_BRANCHES: ${{ inputs.reject-branches }}
        ANCESTOR_OF: ${{ inputs.ancestor-of }}
      run: |
        set -euo pipefail

        if [[ "$STABLE_ONLY" != true && "$STABLE_ONLY" != false ]]; then
          echo "::error::Invalid stable-only '$STABLE_ONLY'; expected true or false." >&2
          exit 1
        fi
        if [[ "$REJECT_BRANCHES" != true && "$REJECT_BRANCHES" != false ]]; then
          echo "::error::Invalid reject-branches '$REJECT_BRANCHES'; expected true or false." >&2
          exit 1
        fi

        git fetch --all --tags

        TAG="$REQUESTED_TAG"
        if [[ -z "$TAG" ]]; then
          # Discover the newest version tag. Legacy tags carry a 'v' prefix;
          # normalize it away before filtering and sorting.
          if [[ "$STABLE_ONLY" == true ]]; then
            PATTERN='^[0-9]+\.[0-9]+\.[0-9]+$'
          else
            PATTERN='^[0-9]+\.[0-9]+\.[0-9]+(-.*)?$'
          fi
          TAG=$(git tag --list |
            sed 's/^v//' |
            grep -E "$PATTERN" |
            sort -rV | head -n 1 || true)
          if [[ -z "$TAG" ]]; then
            if [[ "$STABLE_ONLY" == true ]]; then
              echo "::error::No stable release tag was found." >&2
            else
              echo "::error::No release tag was found." >&2
            fi
            exit 1
          fi
        fi

        if [[ "$REJECT_BRANCHES" == true ]] &&
           { [[ "$TAG" == main ]] ||
             git rev-parse --verify "refs/heads/$TAG^{commit}" >/dev/null 2>&1 ||
             git rev-parse --verify "refs/remotes/origin/$TAG^{commit}" >/dev/null 2>&1; }; then
          echo "::error::Source '$TAG' is a branch; stabilization must start from a release tag." >&2
          exit 1
        fi

        # Resolve the actual tag ref: try the requested form first, then the
        # legacy v-prefixed form so 'v1.1.1' and '1.1.1' both resolve.
        RESOLVED_TAG=""
        if SHA=$(git rev-parse --verify "refs/tags/$TAG^{commit}" 2>/dev/null); then
          RESOLVED_TAG="$TAG"
        elif SHA=$(git rev-parse --verify "refs/tags/v$TAG^{commit}" 2>/dev/null); then
          RESOLVED_TAG="v$TAG"
        fi

        if [[ -z "$RESOLVED_TAG" ]]; then
          if [[ "$REJECT_BRANCHES" == true ]]; then
            echo "::error::Release tag '$TAG' does not exist; stabilization must start from an existing release tag." >&2
          else
            echo "::error::Release tag '$TAG' does not exist." >&2
          fi
          exit 1
        fi

        VERSION="${RESOLVED_TAG#v}"
        if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+(-.*)?$ ]]; then
          echo "::error::Release tag '$RESOLVED_TAG' does not contain a version in X.Y.Z[-suffix] format." >&2
          exit 1
        fi
        TAG_LINE="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
        if [[ "$STABLE_ONLY" == true && "$VERSION" == *-* ]]; then
          echo "::error::Release tag '$RESOLVED_TAG' is a prerelease; a stable X.Y.Z release tag is required." >&2
          exit 1
        fi
        if [[ -n "$REQUESTED_LINE" && "$TAG_LINE" != "$REQUESTED_LINE" ]]; then
          echo "::error::Release tag '$RESOLVED_TAG' belongs to release line '$TAG_LINE', not requested line '$REQUESTED_LINE'." >&2
          exit 1
        fi

        if [[ -n "$ANCESTOR_OF" ]] &&
           ! git merge-base --is-ancestor "$SHA" "origin/$ANCESTOR_OF"; then
          echo "::error::Base tag '$RESOLVED_TAG' is not an ancestor of '$ANCESTOR_OF'." >&2
          exit 1
        fi

        {
          echo "tag=$RESOLVED_TAG"
          echo "version=$VERSION"
          echo "sha=$SHA"
          echo "line=$TAG_LINE"
          echo "core=${VERSION%%-*}"
        } >> "$GITHUB_OUTPUT"
