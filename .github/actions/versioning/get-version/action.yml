name: 'Get Version'
description: 'Extract the current version from Directory.Build.props and parse it'
inputs:
  branch:
    description: 'Branch name (for context)'
    required: false
    default: ''

outputs:
  version:
    description: 'Current version from Directory.Build.props'
    value: ${{ steps.get-version.outputs.version }}
  major:
    description: 'Major version component'
    value: ${{ steps.parse.outputs.major }}
  minor:
    description: 'Minor version component'
    value: ${{ steps.parse.outputs.minor }}
  patch:
    description: 'Patch version component'
    value: ${{ steps.parse.outputs.patch }}
  suffix:
    description: 'Version suffix (if any)'
    value: ${{ steps.parse.outputs.suffix }}
  stage:
    description: 'Release stage (stable, dev, alpha, beta, or rc)'
    value: ${{ steps.parse.outputs.stage }}
  sequence:
    description: 'Sequence/build number from the suffix (e.g., 1 from alpha.1 or dev.YYMMDD.1)'
    value: ${{ steps.parse.outputs.sequence }}
  is-prerelease:
    description: 'Whether this is a pre-release version'
    value: ${{ steps.parse.outputs.is-prerelease }}

runs:
  using: "composite"
  steps:
    - name: Get version from Directory.Build.props
      id: get-version
      shell: bash
      run: |
        VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
        echo "Current version: $VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Parse version components
      id: parse
      uses: ./.github/actions/versioning/parse-version
      with:
        version: ${{ steps.get-version.outputs.version }}
