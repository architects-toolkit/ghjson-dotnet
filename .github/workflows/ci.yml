name: 🔨 CI Build & Test

# Description: Builds the solution and runs tests on every push and PR.
# This is a required check for PRs targeting main, release/*, and hotfix/* branches.
#
# Triggers:
# - Push to main
# - Pull requests targeting main, release/*, or hotfix/*
# - Merge queue (merge_group) checks for protected branches
# - Manual dispatch (used to run required checks on automation-created PRs)
#
# Permissions:
# - contents:read - Required to read repository content

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - 'release/**'
      - 'hotfix/**'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number (informational)
        required: false
        type: string
      base_ref:
        description: Pull request base branch (informational)
        required: false
        type: string
      pr_title:
        description: Pull request title (informational)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: 🔨 Build & Test
    runs-on: windows-latest
    strategy:
      matrix:
        dotnet-version: ['7.0.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload coverage reports
        uses: codecov/codecov-action@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          files: "**/coverage.cobertura.xml"
          fail_ci_if_error: false
